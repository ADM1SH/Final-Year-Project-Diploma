<body class="bg-background min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a linear/transactional screen (Login). -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Decorative Ambient Orbs -->
<div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-secondary-fixed/30 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-md z-10">
<!-- Glassmorphic Container -->
<div class="bg-surface-container-lowest/80 backdrop-blur-xl rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-md md:p-lg border border-white/50 relative overflow-hidden">
<!-- Inner soft gradient for premium feel -->
<div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center">
<!-- Humanized Silhouette Icon -->
<div class="w-20 h-20 bg-secondary-fixed-dim rounded-full flex items-center justify-center mb-sm shadow-inner">
<span class="material-symbols-outlined text-[40px] text-on-secondary-container" data-icon="person" style="font-variation-settings: 'FILL' 1;">
                            person
                        </span>
</div>
<!-- Brand Logo -->
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-base text-center">
                        MyPreLove
                    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-lg">
                        Welcome back to conscious commerce.
                    </p>
<!-- Login Form -->
<form action="#" class="w-full space-y-sm" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border-none rounded-lg font-body-md text-body-md text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-container-low border-none rounded-lg font-body-md text-body-md text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg shadow-md hover:bg-primary-container hover:shadow-lg active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                                Login
                                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-md">
<div class="flex-grow h-px bg-surface-variant"></div>
<span class="font-label-sm text-label-sm text-outline">OR</span>
<div class="flex-grow h-px bg-surface-variant"></div>
</div>
<!-- Register Link -->
<div class="text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant mb-3">New to MyPreLove?</p>
<a class="inline-block w-full bg-gradient-to-r from-secondary-container to-tertiary-container text-on-secondary-container font-label-md text-label-md py-4 rounded-lg shadow-md hover:opacity-90 active:scale-95 transition-all duration-200" href="#">
                            Register Now
                        </a>
</div>
</div>
</div>
<!-- Contextual Footer Links -->
<div class="flex justify-center gap-md mt-md text-on-surface-variant font-label-sm text-label-sm">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="text-surface-variant">•</span>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</main>
<script>
        // Simple input interaction for label color change
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', (e) => {
                const icon = e.target.previousElementSibling.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.classList.remove('text-outline-variant');
                    icon.classList.add('text-primary');
                }
            });
            input.addEventListener('blur', (e) => {
                const icon = e.target.previousElementSibling.querySelector('.material-symbols-outlined');
                if(icon) {
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-outline-variant');
                }
            });
        });
    </script>
