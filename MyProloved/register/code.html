<body class="bg-background min-h-screen text-on-surface antialiased flex flex-col selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Transactional Screen: Navigational Shells are intentionally suppressed per the logic rules -->
<main class="flex-grow flex items-center justify-center p-0 md:p-lg">
<!-- Bento/Card Container -->
<div class="w-full max-w-[1000px] min-h-screen md:min-h-0 bg-surface-container-lowest md:rounded-xl shadow-none md:shadow-[0px_4px_20px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col md:flex-row">
<!-- Visual Anchor / Branding (Desktop Only) -->
<div class="hidden md:block w-1/2 relative bg-surface-container-low">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A high-quality, aspirational lifestyle photograph of a minimalist walk-in closet bathed in warm, natural morning light. The closet features neatly arranged curated, sustainable clothing items on wooden hangers, hinting at a curated wardrobe. The scene is bright, modern, and embodies a tactile minimalist aesthetic with organic softness, using soft shadows and a warm color palette of creams, light woods, and muted earthy tones to reflect high-end boutique retail and conscious commerce." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDeQ88DgcOPkiqTKtR0m1y2E2KfxcuwBamD33FnBjrcJLF4QJmli4jDDEuHg5qMKHWdITzlRJPiWpCMsL57RSEe2ek6cCZBwSBa4RBmyZHh8Sf_jWPU7-LXztZ1dEKJ8hGu0jpjmJeOa-g5N_BoB_GbwEf1rhDXD3Su4GMQB2893vZu8xmmpWcuv2aFWNddmxJbo8hP95fkEb9XEaADlU96X2ymkeoMBE0RYFk-F4f2-QCA9d22wbWllv4bY3SJ9q2ikliCyBm0GVf-');">
<!-- Subtle gradient overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-background/40 to-transparent"></div>
</div>
<!-- Branding overlay -->
<div class="absolute bottom-xl left-lg right-lg text-on-primary drop-shadow-md">
<h1 class="font-display-lg text-display-lg tracking-tight mb-sm">MyPreLove</h1>
<p class="font-body-lg text-body-lg opacity-90 max-w-sm">Join our conscious community. Discover curated luxury and extend the lifecycle of beautiful garments.</p>
</div>
</div>
<!-- Form Section -->
<div class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile py-xl md:p-xl bg-surface-container-lowest">
<div class="w-full max-w-sm flex flex-col">
<!-- Mobile Header -->
<div class="md:hidden text-center mb-lg">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight mb-xs">MyPreLove</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Conscious community commerce.</p>
</div>
<!-- Form Header -->
<div class="mb-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-base">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to get started.</p>
</div>
<form action="#" class="flex flex-col gap-sm" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="bg-surface border border-outline-variant rounded-lg px-sm py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<input class="bg-surface border border-outline-variant rounded-lg px-sm py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="bg-surface border border-outline-variant rounded-lg px-sm py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<input class="bg-surface border border-outline-variant rounded-lg px-sm py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="confirmPassword" name="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface transition-colors cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant text-sm cursor-pointer" for="terms">
                                I agree to the <a class="text-primary hover:underline font-label-md text-label-md" href="#">Terms &amp; Conditions</a> and Privacy Policy.
                            </label>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-primary text-on-primary py-3 px-6 rounded-full font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-xs" type="submit">
                            Create Account
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-md text-center pt-sm border-t border-surface-variant">
<p class="font-body-md text-body-md text-on-surface-variant">
                            Already have an account? 
                            <a class="text-primary font-label-md text-label-md hover:underline transition-all" href="#">Log in</a>
</p>
</div>
</div>
</div>
</div>
</main>
