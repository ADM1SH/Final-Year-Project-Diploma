<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MyPreLove - List an Item</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f9f9f8",
                        "primary-fixed": "#b2f1bf",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f9f9f8",
                        "on-secondary-container": "#6a1b00",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed-variant": "#14512d",
                        "on-secondary-fixed-variant": "#852400",
                        "outline-variant": "#c0c9be",
                        "on-primary-fixed": "#00210d",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeed",
                        "tertiary": "#735c00",
                        "surface": "#f9f9f8",
                        "secondary": "#a73a15",
                        "tertiary-fixed": "#ffe088",
                        "on-surface": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2f3130",
                        "on-error-container": "#93000a",
                        "primary": "#002c13",
                        "error": "#ba1a1a",
                        "on-primary-container": "#76b284",
                        "surface-container-low": "#f3f4f3",
                        "primary-container": "#014421",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-surface-variant": "#404941",
                        "surface-tint": "#306a43",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#cca72f",
                        "on-error": "#ffffff",
                        "surface-dim": "#dadad9",
                        "on-tertiary-fixed": "#241a00",
                        "tertiary-fixed-dim": "#e9c349",
                        "secondary-container": "#fe794f",
                        "secondary-fixed": "#ffdbd0",
                        "outline": "#717970",
                        "on-secondary-fixed": "#3a0a00",
                        "on-tertiary-container": "#4e3d00",
                        "on-background": "#1a1c1c",
                        "surface-container-highest": "#e2e2e2",
                        "inverse-primary": "#97d5a5",
                        "surface-container-high": "#e8e8e7",
                        "inverse-on-surface": "#f1f1f0",
                        "primary-fixed-dim": "#97d5a5",
                        "secondary-fixed-dim": "#ffb59f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "base": "4px",
                        "margin-desktop": "120px",
                        "margin-mobile": "20px",
                        "lg": "40px",
                        "gutter": "16px",
                        "sm": "16px",
                        "xl": "64px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Playfair Display"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "label-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pb-32">
<!-- Transactional Flow Header -->
<header class="flex items-center justify-between px-margin-mobile pt-lg pb-md sticky top-0 bg-background/90 backdrop-blur-md z-40">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface group-hover:scale-95 transition-transform">close</span>
</button>
<div class="font-label-md text-label-md text-on-surface-variant bg-surface-container-high px-4 py-1.5 rounded-full shadow-[0px_4px_20px_rgba(0,0,0,0.02)]">
            Step 1 of 2
        </div>
<div class="w-10 h-10"></div> <!-- Spacer for perfect centering -->
</header>
<main class="flex-1 px-margin-mobile flex flex-col gap-lg max-w-2xl w-full mx-auto mt-4">
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background tracking-tight">List your item</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Let's find a new home for your pre-loved piece.</p>
</div>
<!-- Visuals Uploader Bento Grid -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                Visuals
                <span class="text-[12px] font-normal text-outline bg-surface-container px-2 py-0.5 rounded-full">Up to 10</span>
</h2>
<div class="grid grid-cols-2 gap-gutter mt-1">
<!-- Take Photo - Primary Action -->
<button class="aspect-square flex flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-primary bg-primary/5 hover:bg-primary/10 transition-all active:scale-95 group">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center shadow-[0px_4px_20px_rgba(0,44,19,0.15)] group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-label-md text-label-md text-primary">Take Photo</span>
</button>
<!-- Gallery - Secondary Action -->
<button class="aspect-square flex flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-all active:scale-95 group shadow-[0px_4px_20px_rgba(0,0,0,0.02)]">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center group-hover:-translate-y-1 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant">photo_library</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Gallery</span>
</button>
</div>
</section>
<!-- Details Input Bento Box -->
<section class="flex flex-col gap-sm mt-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Details</h2>
<div class="flex flex-col gap-6 bg-surface-container-lowest p-sm md:p-md rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.03)] border border-white/50">
<!-- Title Input -->
<div class="flex flex-col gap-2 relative group">
<label class="font-label-md text-label-md text-on-surface-variant transition-colors group-focus-within:text-primary" for="listing-title">What are you listing?</label>
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 font-body-md text-body-md text-on-background placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all outline-none" id="listing-title" placeholder="e.g. Vintage Silk Blouse" type="text"/>
</div>
<!-- Category Select -->
<div class="flex flex-col gap-2 relative group">
<label class="font-label-md text-label-md text-on-surface-variant transition-colors group-focus-within:text-primary" for="listing-category">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 font-body-md text-body-md text-on-background focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest outline-none transition-all appearance-none" id="listing-category">
<option class="text-outline" disabled="" selected="" value="">Select a category</option>
<option value="clothing">Womenswear</option>
<option value="accessories">Accessories &amp; Bags</option>
<option value="shoes">Footwear</option>
<option value="home">Lifestyle &amp; Home</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none group-focus-within:text-primary transition-colors">keyboard_arrow_down</span>
</div>
</div>
<!-- Description Textarea -->
<div class="flex flex-col gap-2 relative group">
<label class="font-label-md text-label-md text-on-surface-variant transition-colors group-focus-within:text-primary" for="listing-desc">Description</label>
<textarea class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 font-body-md text-body-md text-on-background placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest outline-none transition-all resize-none" id="listing-desc" placeholder="Share the story behind this piece, its condition, and any specific details..." rows="4"></textarea>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full px-margin-mobile py-6 bg-background/80 backdrop-blur-xl border-t border-white/20 shadow-[0px_-4px_20px_rgba(0,0,0,0.02)] z-50">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full flex items-center justify-center py-4 rounded-full bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-lg active:scale-[0.98]">
                Next Step
            </button>
</div>
</div>
</body></html>
